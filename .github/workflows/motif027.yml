name: MOTIF-027 Capability Gardener Evaluation
on:
  push:
    branches: [research/027-capability-gardener-evaluation]
  pull_request:
    paths:
      - 'experiments/027/**'
      - '.github/workflows/motif027.yml'
permissions:
  contents: read
jobs:
  gardener-and-boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reverify original MOTIF-026 source and research controls
        run: node --test experiments/026/test_discovery_machine.mjs
      - name: New adaptive paths, held-out failure counterexample, independent live read boundaries
        run: node --test experiments/027/test_gardener.mjs
      - name: Run independent fixed public Open-Meteo live read (no user data)
        run: |
          node --input-type=module -e "import {probePublicExample} from './experiments/027/graft/src/live-pilot-027.mjs';import {writeFileSync} from 'node:fs';const r=await probePublicExample({approvedPublicPilot:true});if(r.status!=='READ_ONLY_THIRD_PARTY_RESPONSE_OBSERVED'||r.requests!==1||r.code_installed)process.exit(1);writeFileSync('motif027-real-live-read.json',JSON.stringify(r,null,2));console.log(JSON.stringify({host:r.endpoint_host,example:r.example_location,read:true,originalWorldFactVerified:false}));"
      - uses: actions/upload-artifact@v4
        with:
          name: motif027-real-live-read-evidence
          path: motif027-real-live-read.json
          retention-days: 14
