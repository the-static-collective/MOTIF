name: MOTIF GENIUS-001 architecture of discovery

on:
  push:
    paths:
      - "experiments/genius001/**"
      - ".github/workflows/genius001.yml"
  pull_request:
    paths:
      - "experiments/genius001/**"
      - ".github/workflows/genius001.yml"

jobs:
  discovery-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run finite receipts, negative controls and abstention tests
        run: python -m unittest discover -s experiments/genius001 -p 'test_genius.py' -v
