name: COLLECTIVE-004 question grammar invention
on:
  push:
    branches:
      - experiment/collective-004-invent-discriminator-grammar
  pull_request:
    paths:
      - 'experiments/collective004/**'
      - '.github/workflows/collective004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-question-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MOTIF stacked research
        uses: actions/checkout@v4
      - name: Checkout original National Treasure cases
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/national-treasure
          ref: a6f1533537f88e837ba1560731d23645676a5b52
          path: external/nt-cases
          persist-credentials: false
      - name: Checkout original National Treasure Question Box
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/national-treasure
          ref: 28fbf9b10d003f7c577143550d17cc17f8109cb1
          path: external/nt-question-box
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Original question engine's own tests
        working-directory: external/nt-question-box
        run: node tools/question-box/test.mjs
      - name: Original Cicada fixture tests
        working-directory: external/nt-cases
        run: node --test cases/cicada-overfit/validate.test.mjs
      - name: New old-menu-inadequacy and question-invention falsifiers
        env:
          NT_CASE_ROOT: external/nt-cases
          NT_BOX_ROOT: external/nt-question-box
        run: python -m unittest discover -s experiments/collective004 -p 'test_*.py' -v
      - name: Inherited proof carrying question regression checks
        env:
          NT_CASE_ROOT: external/nt-cases
          NT_BOX_ROOT: external/nt-question-box
        run: python -m unittest discover -s experiments/collective003 -p 'test_*.py' -v
      - name: Execute full proof-carrying synthetic source observation
        run: |
          python experiments/collective004/demo.py \
            --case-root external/nt-cases \
            --box-root external/nt-question-box \
            > collective004-question-language-evidence.json
      - name: Archive inspectable old/new question evidence
        uses: actions/upload-artifact@v4
        with:
          name: COLLECTIVE004-QUESTION-GRAMMAR-RESEARCH-HOLD
          path: collective004-question-language-evidence.json
