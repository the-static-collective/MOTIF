name: MOTIF Law Forge 004 — Grammar Breaker

on:
  push:
    branches:
      - research/law-forge-004-grammar-breaker-20261105
    paths:
      - 'experiments/law-forge-001/**'
      - 'experiments/law-forge-002/**'
      - 'experiments/law-forge-003/**'
      - 'experiments/law-forge-004/**'
      - '.github/workflows/law-forge-004.yml'
  pull_request:
    paths:
      - 'experiments/law-forge-001/**'
      - 'experiments/law-forge-002/**'
      - 'experiments/law-forge-003/**'
      - 'experiments/law-forge-004/**'
      - '.github/workflows/law-forge-004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-breaker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify inherited LAW-FORGE-001
        run: python -m unittest discover -s experiments/law-forge-001 -p 'test_*.py' -v
      - name: Verify inherited LAW-FORGE-002
        run: python -m unittest discover -s experiments/law-forge-002 -p 'test_*.py' -v
      - name: Verify inherited LAW-FORGE-003
        run: python -m unittest discover -s experiments/law-forge-003 -p 'test_*.py' -v
      - name: Verify new state-program inventor
        run: python -m unittest discover -s experiments/law-forge-004 -p 'test_*.py' -v
      - name: Generate full procedural evaluation receipt
        run: |
          python experiments/law-forge-004/trial.py > law-forge-004-results.json
          python -m json.tool law-forge-004-results.json > /dev/null
      - name: Print matched classical controls and method decision
        run: |
          python -c "import json; d=json.load(open('law-forge-004-results.json')); print(json.dumps({'development':d['development'],'evaluation':d['evaluation'],'decision':d['frozen_method_decision'],'three_state_transitions':d['example_three_state_history']['stateful_operator_packet']['transitions']},indent=2))"
      - name: Preserve falsification and program receipt
        uses: actions/upload-artifact@v4
        with:
          name: law-forge-004-receipt
          path: law-forge-004-results.json
          retention-days: 30
