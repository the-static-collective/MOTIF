name: MOTIF-020 MADD Source-Custody Maxhinal
on:
  push:
    branches:
      - research/020-madd-source-custody-maxhinal
  pull_request:
    paths:
      - 'experiments/014/**'
      - 'experiments/015/**'
      - 'experiments/016/**'
      - 'experiments/017/**'
      - 'experiments/018/**'
      - 'experiments/019/**'
      - 'experiments/020/**'
      - '.github/workflows/motif020.yml'
jobs:
  native-maxhinal-crossing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native original Question Box + Dogram 
        run: node --test experiments/014/test_garden.mjs
      - name: MOTIF-015 invented method regression
        run: node --test experiments/015/test_graft.mjs
      - name: MOTIF-016 revisable meta-method regression
        run: node --test experiments/016/test_meta.mjs
      - name: MOTIF-017 question portfolios regression
        run: node --test experiments/017/test_question_machine.mjs
      - name: MOTIF-018 witness-of-witness regression
        run: node --test experiments/018/test_witness_machine.mjs
      - name: MOTIF-019 hidden common ancestor regression
        run: node --test experiments/019/test_common_ancestor.mjs
      - name: Exact original MADD Maxhinal transplant and append-only challenge
        run: node --test experiments/020/test_madd_custody.mjs
      - name: Source-preserving cross-organ receipt
        run: node experiments/020/madd_custody.mjs > motif020-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: motif020-maxhinal-original-chambers-synthetic-ride
          path: motif020-research.json
          retention-days: 14
