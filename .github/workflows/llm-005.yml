name: LLM-005 ODYSSEY-240 Long Causal Chain
on:
  push:
    branches:
      - experiment/llm005-odyssey-240-reason-chain-20261112
  pull_request:
    paths:
      - 'experiments/llm005/**'
      - 'experiments/llm004/hypermap.py'
      - '.github/workflows/llm-005.yml'
  workflow_dispatch:
jobs:
  pressure-reason-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONPATH: experiments/llm003:experiments/llm004:experiments/llm005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Long chain state-boundary tests
        run: python -m unittest discover -s experiments/llm005 -p 'test_*.py' -v
      - name: Retest inherited Reason Hypermap
        run: python -m unittest discover -s experiments/llm004 -p 'test_*.py' -v
      - name: Run 64 heldout authored 219+ step causal worlds, compare all strategies
        run: |
          mkdir -p /tmp/odyssey240
          python experiments/llm005/odyssey.py > /tmp/odyssey240/benchmark.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/odyssey240/benchmark.json'))
          print('WORLD_COUNT',data['seed_count'],'MIN_REQUIRED_ACTIONS',data['sequential_required_actions'])
          for arm in data['arms']:
              print('ARM',arm)
          print('WINNER_RANK',data['ranking'])
          PY
      - name: Build the complete offline interactive 219+ action viewer
        run: python experiments/llm005/build_viewer.py --out /tmp/odyssey240 --study-file /tmp/odyssey240/benchmark.json
      - name: Execute 4 registered marathon scenarios (879+ minimum steps each)
        run: |
          python experiments/llm005/marathon.py > /tmp/odyssey240/marathon-study.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/odyssey240/marathon-study.json'))
          assert a['sequential_minimum']==879 and a['required_decision_gates']==384
          print('MARATHON_WORLDS',a['independent_registered_groups'])
          for x in a['arms']:print('MARATHON_ARM',x)
          PY
      - name: Publish first registered complete marathon's global hash-linked replay
        run: python experiments/llm005/build_marathon.py --out /tmp/odyssey240 --study-file /tmp/odyssey240/marathon-study.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check shipped interactive longchain script and confirm causal depth
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          folder=Path('/tmp/odyssey240')
          data=json.loads((folder/'odyssey240-dossier.json').read_text())
          assert all(t['summary']['completed'] for t in data['traces'].values())
          assert all(t['summary']['actions']>=219 for t in data['traces'].values())
          assert data['real_model'] is False and data['external_actions'] is False
          raw=(folder/'odyssey240.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',raw,re.S)
          assert len(js)==1 and '__PAYLOAD__' not in raw
          (folder/'odyssey-script.js').write_text(js[0])
          print('ODYSSEY_OFFLINE_ACTIONS',{p:t['summary']['actions'] for p,t in data['traces'].items()})
          PY
          node --check /tmp/odyssey240/odyssey-script.js
      - name: Syntax-check all 879+ stage marathon browser code
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          folder=Path('/tmp/odyssey240')
          data=json.loads((folder/'marathon-dossier.json').read_text())
          first=data['records']['hypermap_voi']['summary']
          assert first['completed'] and first['actual_serial_actions']>=879
          assert first['completed_decision_gates']==384
          assert first['mandatory_handoffs_completed']==3
          html=(folder/'marathon.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(js)==1 and '__PAYLOAD__' not in html
          (folder/'marathon-script.js').write_text(js[0])
          print('MARATHON_ACTUAL_STEPS',first['actual_serial_actions'])
          print('MARATHON_REASONING_WORLDS',first['distinct_source_owner_seeds'])
          PY
          node --check /tmp/odyssey240/marathon-script.js
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey240-longchain-results
          path: /tmp/odyssey240/*
          retention-days: 30
