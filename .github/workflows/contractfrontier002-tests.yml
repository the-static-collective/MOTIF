name: CONTRACT-FRONTIER-002 conditional graph laws

on:
  push:
    branches:
      - 'experiment/contract-frontier-002-20261109'
  pull_request:
    paths:
      - 'experiments/contractfrontier002/**'
      - 'experiments/contractdiscovery001/**'
      - 'experiments/mathal001/**'
      - 'experiments/fir001/**'
      - '.github/workflows/contractfrontier002-tests.yml'

permissions:
  contents: read

jobs:
  graph-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prior constitutional and linear controls
        shell: bash
        run: |
          set -eu
          (cd experiments/fir001 && python -m unittest -q test_fir.py)
          (cd experiments/mathal001 && python -m unittest -q test_mathal.py)
          (cd experiments/contractdiscovery001 && python -m unittest -q test_contractdiscovery.py)
      - name: New conditional/topological laws and hostile controls
        working-directory: experiments/contractfrontier002
        run: |
          python -m unittest -v test_contractfrontier.py
          python contractfrontier.py
          python benchmark.py
