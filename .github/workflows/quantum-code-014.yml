name: MOTIF QC-014 anti-stagnation recovery
on:
  push:
    paths:
      - 'experiments/quantumcode014/**'
      - '.github/workflows/quantum-code-014.yml'
  pull_request:
    paths:
      - 'experiments/quantumcode014/**'
      - '.github/workflows/quantum-code-014.yml'
permissions:
  contents: read
jobs:
  bounded-action-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Crafter game engine
        run: python -m pip install 'crafter==1.8.3' pillow
      - name: Run generic anti-stagnation tests
        working-directory: experiments/quantumcode014
        run: python -m unittest -v test_insanity.py test_archived_case.py
      - name: Run genuine controlled failure and ordinary seeded Crafter worlds
        env:
          QC014_OUTPUT_DIR: runs/crafter-qc014
        run: python experiments/quantumcode014/game_loop.py
      - name: Verify all game traces with unmodified QC-011 parser
        run: |
          python - <<'PY'
          import pathlib,sys,json
          sys.path.insert(0,"experiments/quantumcode011")
          from ingest import read_bundle
          root=pathlib.Path("runs/crafter-qc014")
          comparisons=json.loads((root/"comparison.json").read_text())
          files=sorted(root.glob("*/annotated_gameplay.json"))
          assert len(files)==16,len(files)
          steps=0
          for file in files:
              r=read_bundle(file)
              assert all(e.source=="GAME_TELEMETRY" for e in r.episodes)
              steps+=len(r.episodes)
          assert len(comparisons["controlled_injection_pairs"])==4
          assert len(comparisons["ordinary_game_pairs"])==4
          print("QC014_VERIFIED_GAME_STEPS="+str(steps))
          PY
      - name: Publish game trace and control comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc014-insanity-prevention-game-evidence
          path: runs/crafter-qc014/
          if-no-files-found: warn
          retention-days: 30
