name: MOTIF QC-013 human expert dataset interpreter
on:
  push:
    paths:
      - 'experiments/quantumcode013/**'
      - '.github/workflows/quantum-code-013.yml'
  pull_request:
    paths:
      - 'experiments/quantumcode013/**'
      - '.github/workflows/quantum-code-013.yml'
permissions:
  contents: read
jobs:
  human-trace-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local research dependencies
        run: python -m pip install 'crafter==1.8.3' pillow 'numpy>=1.24,<3'
      - name: Test NPZ ingestion, temporal integrity, provenance and QC-011 compatibility
        working-directory: experiments/quantumcode013
        run: python -m unittest -v test_human_dataset.py
      - name: Confirm actual uploaded dataset is not checked into source
        run: |
          test ! -f experiments/quantumcode013/dataset.zip
          test ! -d experiments/quantumcode013/dataset
          echo 'Human source archive stays with the user; CI uses synthetic parser fixtures only.'
      - name: Play paired real Crafter worlds with human-informed alternative
        env:
          QC013_OUTPUT_DIR: runs/crafter-qc013
        run: python experiments/quantumcode013/expert_intervention.py
      - name: Validate each actual paired replay with unchanged QC-011
        run: |
          python - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,"experiments/quantumcode011")
          from ingest import read_bundle
          root=pathlib.Path("runs/crafter-qc013")
          runs=json.loads((root/"paired_results.json").read_text())
          files=sorted(root.glob("*/annotated_gameplay.json"))
          assert len(files)==len(runs["paired_results"])*2
          total=0
          for file in files:
              r=read_bundle(file)
              assert len(r.episodes)>20
              assert all(x.source=="GAME_TELEMETRY" for x in r.episodes)
              total+=len(r.episodes)
          print("QC013_VERIFIED_GAME_STEPS="+str(total))
          PY
      - name: Upload real paired game traces and visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc013-human-informed-crafter-playtests
          path: runs/crafter-qc013/
          if-no-files-found: warn
          retention-days: 30
