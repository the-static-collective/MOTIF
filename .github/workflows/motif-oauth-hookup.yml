name: MOTIF OAuth MCP hookup (pinned app + security)
on:
  pull_request:
    paths:
      - 'integrations/motif-living-reasoner/**'
      - '.github/workflows/motif-oauth-hookup.yml'
  push:
    branches:
      - 'integration/motif-mcp-oauth-hookup-001'
    paths:
      - 'integrations/motif-living-reasoner/**'
      - '.github/workflows/motif-oauth-hookup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-oauth-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install auth test dependencies
        run: python -m pip install 'PyJWT[crypto]==2.13.0' 'httpx==0.28.1'
      - name: Run offline signature and ASGI boundary tests
        working-directory: integrations/motif-living-reasoner
        run: python -m unittest -v test_oauth_gateway.py
      - name: Verify original artifact hash before extracting
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("integrations/motif-living-reasoner/release-v0.3.zip")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "7f442cefc995115b5383faf87e0f922a594d7f0a480039c2e5aecc85c122c993"
          PY
      - name: Extract original server without changing its source
        run: |
          mkdir -p /tmp/motif-forest-mcp
          unzip -q integrations/motif-living-reasoner/release-v0.3.zip -d /tmp/motif-forest-mcp
          cp integrations/motif-living-reasoner/oauth_gateway.py /tmp/motif-forest-mcp/motif-living-reasoner/
          cp integrations/motif-living-reasoner/smoke_pinned_server.py /tmp/motif-forest-mcp/motif-living-reasoner/
      - name: Install original server's dependencies
        working-directory: /tmp/motif-forest-mcp/motif-living-reasoner
        run: python -m pip install -r requirements.txt
      - name: Run original 18-tool server through new OAuth gateway
        working-directory: /tmp/motif-forest-mcp/motif-living-reasoner
        run: python smoke_pinned_server.py
      - name: Verify deploy instructions do not run old public bearer service
        run: |
          grep -q 'oauth_gateway:build_app' integrations/motif-living-reasoner/start-railway.sh
          grep -q 'COPY oauth_gateway.py' integrations/motif-living-reasoner/Dockerfile
          if grep -q 'uvicorn mcp_server.server:app' integrations/motif-living-reasoner/start-railway.sh; then exit 1; fi
