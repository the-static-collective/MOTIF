name: MOTIF QC-017 observed-world generated game plans
on:
  push:
    paths:
      - 'experiments/quantumcode017/**'
      - '.github/workflows/quantum-code-017.yml'
  pull_request:
    paths:
      - 'experiments/quantumcode017/**'
      - '.github/workflows/quantum-code-017.yml'
permissions:
  contents: read
jobs:
  plans-and-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test action-level search, epistemic constraints and counterexamples
        working-directory: experiments/quantumcode017
        run: python -m unittest -v test_plan.py
      - name: Install independent survival game engine and reference sensor
        run: python -m pip install 'crafter==1.8.3' pillow
      - name: Execute 56 real controlled Crafter game episodes with generated plans
        env:
          QC017_OUTPUT_DIR: runs/crafter-qc017
        run: python experiments/quantumcode017/real_game.py
      - name: Validate original QC-011 trace integrity and actual outcomes
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0,"experiments/quantumcode011")
          from ingest import read_bundle
          root=pathlib.Path("runs/crafter-qc017")
          result=json.loads((root/"comparison.json").read_text())
          assert result["run_count"]==56
          assert len(result["pairs"])==28
          assert all(x["bfs_status"]=="HOLD_NO_WITNESSED_GOAL_ACCESS"
                     for x in result["pairs"]
                     if x["scenario"]=="hidden_resource")
          # Regression against the first actual execution defect: all 48
          # visible-resource plans used to fail when the test fixture
          # accidentally deleted the player from the game world.
          for pair in result["pairs"]:
              if pair["scenario"]!="hidden_resource":
                  assert pair["bfs_succeeded"],pair
              if pair["scenario"]=="surprise_wall":
                  assert pair["bfs_replanned_after_changed_map"],pair
          assert result["BFS_goal_successes"]==24,result
          actual=0
          paths=sorted(root.glob("*/annotated_gameplay.json"))
          for file in paths:
              r=read_bundle(file)
              assert r.episodes and all(x.source=="GAME_TELEMETRY"
                                        for x in r.episodes)
              actual+=len(r.episodes)
          assert actual==result["game_actions"],(actual,result["game_actions"])
          assert len(paths)==48,(len(paths),len(result["pairs"]))
          # Record outcomes, but do not fabricate success if the engine did
          # not verify a resource was gained.
          print("QC017_VERIFIED_ENGINE_GAME_STEPS="+str(actual))
          print("QC017_VERIFIED_BFS_SUCCESSES="+str(result["BFS_goal_successes"]))
          PY
      - name: Archive complete actual game action, planning and result receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc017-generated-game-plans-and-reality-receipts
          path: runs/crafter-qc017/
          if-no-files-found: warn
          retention-days: 30
