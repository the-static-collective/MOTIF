name: MOTIF IMMUNE-002 classical shoulders of giants

on:
  push:
    paths:
      - "experiments/immune002/**"
      - ".github/workflows/immune-002.yml"
  pull_request:
    paths:
      - "experiments/immune002/**"
      - ".github/workflows/immune-002.yml"

jobs:
  truth-maintenance-and-reference-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact-logic and action-gate falsifiers
        working-directory: experiments/immune002
        run: python -m unittest -v test_giants.py
      - name: Run development and heldout portfolio
        working-directory: experiments/immune002
        run: |
          python benchmark.py > /tmp/immune-002-report.json
          cat /tmp/immune-002-report.json
      - name: Archive source-owned evidence
        uses: actions/upload-artifact@v4
        with:
          name: immune-002-portfolio-report
          path: /tmp/immune-002-report.json
