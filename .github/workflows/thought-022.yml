name: THOUGHT-022 classical vs generative-model synthesis trial
on:
  push:
    paths:
      - 'experiments/thought-022/**'
      - '.github/workflows/thought-022.yml'
  pull_request:
    paths:
      - 'experiments/thought-022/**'
      - '.github/workflows/thought-022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-owned-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify finite grammar closure and adversarial tests
        working-directory: experiments/thought-022
        run: python -m unittest -v test_race.py
      - name: Reproduce complete classical comparison including grammar failure
        working-directory: experiments/thought-022
        run: python benchmark.py
      - name: Regress earlier CEGIS and model critic gates
        working-directory: experiments/thought-021
        run: python -m unittest -v test_constraints.py
      - name: Upload source-only comparison
        uses: actions/upload-artifact@v4
        with:
          name: thought-022-offline-results
          path: experiments/thought-022/offline-results.json
  real-model-comparison:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ollama (ephemeral research runner only)
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          bash "$RUNNER_TEMP/ollama-install.sh"
      - name: Start local model and pull Qwen2.5 3B
        run: |
          (ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &)
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b
      - name: Real generative LLM against classical and grammar-aware hybrid
        working-directory: experiments/thought-022
        run: |
          python run.py --model qwen2.5:3b --tasks intersection invert \
             --model-budget 3 --oracle-budget 2 --timeout 150 --output live-results.json
      - name: Independently verify real inference and non-installation
        working-directory: experiments/thought-022
        run: |
          python - <<'PY'
          import json
          r=json.load(open('live-results.json'))
          assert r['installed'] is False and r['external_authority']=='NONE'
          assert r['real_llm_generations']>=1
          for task,arms in r['tasks'].items():
              m=arms['llm']
              assert m['independent_oracle_calls']<=2
              assert m['model_call_count']<=3
              assert all(x['transport']=='DIRECT_LOOPBACK_OLLAMA_HTTP' and x['http_generation_completed']
                         for x in m['model_receipts'])
              assert m['installed'] is False
              print(task,{'classical':arms['classical']['status'],
                          'llm':m['status'],'hybrid':arms['hybrid']['status'],
                          'llm_calls':m['model_call_count'],'oracle_calls':m['independent_oracle_calls']})
          PY
      - name: Preserve all actual model outcomes (including HOLD)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thought-022-real-qwen3b-vs-classical
          path: experiments/thought-022/live-results.json
          if-no-files-found: ignore
