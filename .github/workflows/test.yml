name: MOTIF experiments
on:
  push:
  pull_request:
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 001
        working-directory: experiments/001
        run: python -m unittest -v test_motif.py
      - name: Test 002
        working-directory: experiments/002
        run: python -m unittest -v test_motif002.py
      - name: Test 003
        working-directory: experiments/003
        run: python -m unittest -v test_affordance.py
      - name: Test 004
        working-directory: experiments/004
        run: python -m unittest -v test_scar.py
      - name: Test 005
        working-directory: experiments/005
        run: python -m unittest -v test_concept.py
      - name: Test 006
        working-directory: experiments/006
        run: python -m unittest -v test_composition.py
      - name: Test 007
        working-directory: experiments/007
        run: python -m unittest -v test_inheritance.py
      - name: Test 008
        working-directory: experiments/008
        run: python -m unittest -v test_unknown.py
      - name: Test 009
        working-directory: experiments/009
        run: python -m unittest -v test_experimenter.py
      - name: Test 027F source-to-question relevance and 3-node native meta-search
        working-directory: experiments/027f
        run: python -m unittest -v test_nodes.py
      - name: Test 026F native-first semantic relay and posthoc relevance diagnostic
        working-directory: experiments/026f
        run: |
          python -m unittest -v test_relay.py
          python -m unittest -v test_diagnostic.py
      - name: Test 025F native job meta-planner and semantic retrieval controls
        working-directory: experiments/025f
        run: |
          python -m unittest -v test_careers.py
          python -m unittest -v test_encoder.py
          python -m unittest -v test_sentinel.py
      - name: Test 022F untrusted critic question feedback, independent synthetic review
        working-directory: experiments/022f
        run: |
          python -m unittest -v test_feedback.py
          python demo.py > /tmp/motif022f.json
          python -c 'import json; d=json.load(open("/tmp/motif022f.json")); assert d["question_decision"]["status"] == "ELIGIBLE_SYNTHETIC_REPLAN_ONLY"; assert not d["actual_T5_executed"]; assert not d["real_world_deployment_or_app_submission"]; print(json.dumps({"status":d["question_decision"]["status"],"before":d["question_decision"]["original_expected_accuracy"],"after":d["question_decision"]["challenged_expected_accuracy"]},indent=2))'
      - name: Test 021F parallel observer critic hypeman isolation and mock demonstration
        working-directory: experiments/021f
        run: |
          python -m unittest -v test_chorus.py
          python demo.py > /tmp/motif021f.json
          python -c 'import json; d=json.load(open("/tmp/motif021f.json")); assert not d["actual_llm_inference"]; assert not d["sidecar"]["adopted_suggestions"]; print(json.dumps(d,indent=2))'
      - name: Test 020F native planZ snapshot and counterfactual inaction losses
        working-directory: experiments/020f
        run: |
          node --version
          python -m unittest -v test_insideout.py
          python demo.py > /tmp/motif020f.json
          cat /tmp/motif020f.json
          python -m unittest -v test_fellowship_timeline.py
          python fellowship_timeline.py > /tmp/fellowship_timeline_motif020f.json
          cat /tmp/fellowship_timeline_motif020f.json
      - name: Test 019F native question box, Dogram and adaptive classical planning
        working-directory: experiments/019f
        run: |
          node --version
          python -m unittest -v test_planner.py
          python benchmark.py > /tmp/motif019f.json
          cat /tmp/motif019f.json
      - name: Test 017F self-growing diagnostic, classical parity and honest drift failures
        working-directory: experiments/017f
        run: |
          python -m unittest -v test_grow.py
          python benchmark.py > /tmp/motif017f.json
          cat /tmp/motif017f.json
      - name: Test 016 adaptive living forest and independent baselines
        working-directory: experiments/016
        run: |
          python -m unittest -v test_forest.py
          python benchmark.py
          python demo.py
      - name: Test 015 joint multiplex inquiry
        working-directory: experiments/015
        run: |
          python -m unittest -v test_multiplex.py
          python demo.py
      - name: Reproduce 014W exact joint uncertain-witness inference
        working-directory: experiments/014w
        run: |
          python benchmark.py > /tmp/motif014.json
          echo '__MOTIF014_RESULT_START__'
          cat /tmp/motif014.json
          echo '__MOTIF014_RESULT_END__'
      - name: Reproduce 014W meta-witness cartridge and observed failures
        working-directory: experiments/014w
        run: |
          python demo.py > /tmp/motif014demo.json
          echo '__MOTIF014_DEMO_START__'
          cat /tmp/motif014demo.json
          echo '__MOTIF014_DEMO_END__'
      - name: Test 014W joint uncertainty
        working-directory: experiments/014w
