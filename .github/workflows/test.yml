name: MOTIF experiments
on:
  push:
  pull_request:
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 001
        working-directory: experiments/001
        run: python -m unittest -v test_motif.py
      - name: Test 002
        working-directory: experiments/002
        run: python -m unittest -v test_motif002.py
      - name: Test 003
        working-directory: experiments/003
        run: python -m unittest -v test_affordance.py
      - name: Test 004
        working-directory: experiments/004
        run: python -m unittest -v test_scar.py
      - name: Test 005
        working-directory: experiments/005
        run: python -m unittest -v test_concept.py
      - name: Test 006
        working-directory: experiments/006
        run: python -m unittest -v test_composition.py
      - name: Test 007
        working-directory: experiments/007
        run: python -m unittest -v test_inheritance.py
      - name: Test inquiry (MOTIF-Q-001)
        working-directory: research/first-question
        run: |
          python -m unittest -v test_question.py
          python -m unittest -v test_baselines.py
          python question.py > /tmp/motif-first-question.json
      - name: Test minimum key (MOTIF-SK-001)
        working-directory: research/smallest-key
        run: |
          python -m unittest -v test_smallest_key.py
          python smallest_key.py > /tmp/motif-smallest-key.json
      - name: Checkout pinned Dogram calculation floor
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: 551b5f9df18f17ec69b452ddcdff01718e0ff771
          path: vendor/Dogram
      - name: Native Dogram probe and anti-collapse study
        working-directory: research/first-question
        run: |
          python dogram_bridge.py --dogram-root ../../vendor/Dogram > /tmp/motif-dogram-query.json
          python - <<'PY'
          import json
          with open('/tmp/motif-dogram-query.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['schema'] == 'motif.dogram-calculate-only/v0'
          assert len(result['pair_receipts']) == 4
          assert result['source']['excluded_trials'] == ['e_refused-part']
          assert result['collapse_analysis']['target_relative_sufficiency'] is True
          assert len(result['collapse_analysis']['dogram_calculation']['lost_distinctions']) == 2
          PY
      - name: Native Dogram rectangle and anti-collapse study
        working-directory: research/smallest-key
        run: |
          python dogram_bridge.py --dogram-root ../../vendor/Dogram > /tmp/motif-dogram-key.json
          python - <<'PY'
          import json
          with open('/tmp/motif-dogram-key.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['schema'] == 'motif.dogram-two-key/v0'
          assert result['rectangle']['mixed_delta'] == {'kind': 'integer', 'value': 1}
          assert result['anti_collapse']['lawful_quotient'] is True
          assert len(result['anti_collapse']['lost_distinctions']) == 3
          PY
      - name: Test generated cooperation bridge
        working-directory: research/missing-bridge
        run: |
          python -m unittest -v test_bridge.py
          python bridge.py > /tmp/motif-bridge.json
      - name: Generate offline human first-door desk
        working-directory: research/missing-bridge
        run: |
          python -m unittest -v test_field_desk.py
          python field_desk.py --output field-desk.html
          test -s field-desk.html
      - name: Save offline field desk artifact
        uses: actions/upload-artifact@v4
        with:
          name: motif-first-door-offline
          path: research/missing-bridge/field-desk.html
          if-no-files-found: error
          retention-days: 30
      - name: Native Dogram inferred-bridge calculation
        working-directory: research/missing-bridge
        run: |
          python dogram_bridge.py --dogram-root ../../vendor/Dogram > /tmp/motif-bridge-dogram.json
          python - <<'PY'
          import json
          with open('/tmp/motif-bridge-dogram.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['schema'] == 'motif.bridge-dogram/v0'
          assert result['rectangle']['mixed_delta'] == {'kind':'integer','value':1}
          assert result['information_collapse']['lawful_quotient'] is True
          assert len(result['information_collapse']['lost_distinctions']) == 3
          assert len(result['binding_ids']) == 2
          PY
      - name: Reproduce 007
        working-directory: experiments/007
        run: python inheritance.py
      - name: Reproduce 006
        working-directory: experiments/006
        run: python composition.py
      - name: Reproduce 005
        working-directory: experiments/005
        run: python concept.py
      - name: Reproduce 004
        working-directory: experiments/004
        run: python scar.py
      - name: Reproduce 003
        working-directory: experiments/003
        run: python affordance.py
      - name: Reproduce 001
        working-directory: experiments/001
        run: python motif.py
      - name: Reproduce 002
        working-directory: experiments/002
        run: python motif002.py
