name: MOTIF experiments
on:
  push:
  pull_request:
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 001
        working-directory: experiments/001
        run: python -m unittest -v test_motif.py
      - name: Test 002
        working-directory: experiments/002
        run: python -m unittest -v test_motif002.py
      - name: Test 003
        working-directory: experiments/003
        run: python -m unittest -v test_affordance.py
      - name: Test 004
        working-directory: experiments/004
        run: python -m unittest -v test_scar.py
      - name: Test 005
        working-directory: experiments/005
        run: python -m unittest -v test_concept.py
      - name: Test 006
        working-directory: experiments/006
        run: python -m unittest -v test_composition.py
      - name: Test 007
        working-directory: experiments/007
        run: python -m unittest -v test_inheritance.py
      - name: Test 008
        working-directory: experiments/008
        run: python -m unittest -v test_unknown.py
      - name: Test 009
        working-directory: experiments/009
        run: python -m unittest -v test_experimenter.py
      - name: Reproduce 009
        working-directory: experiments/009
        run: |
          python benchmark.py > /tmp/motif009.json
          echo '__MOTIF009_RESULT_START__'
          cat /tmp/motif009.json
          echo '__MOTIF009_RESULT_END__'
      - name: Reproduce 009 development stress
        working-directory: experiments/009
        run: |
          python stress.py > /tmp/motif009stress.json
          echo '__MOTIF009_STRESS_START__'
          cat /tmp/motif009stress.json
          echo '__MOTIF009_STRESS_END__'
      - name: Reproduce 008
        working-directory: experiments/008
        run: |
          python benchmark.py > /tmp/motif008.json
          echo '__MOTIF008_RESULT_START__'
          cat /tmp/motif008.json
          echo '__MOTIF008_RESULT_END__'
      - name: Reproduce 007
        working-directory: experiments/007
        run: python inheritance.py
      - name: Reproduce 006
        working-directory: experiments/006
        run: python composition.py
      - name: Reproduce 005
        working-directory: experiments/005
        run: python concept.py
      - name: Reproduce 004
        working-directory: experiments/004
        run: python scar.py
      - name: Reproduce 003
        working-directory: experiments/003
        run: python affordance.py
      - name: Reproduce 001
        working-directory: experiments/001
        run: python motif.py
      - name: Reproduce 002
        working-directory: experiments/002
        run: python motif002.py
