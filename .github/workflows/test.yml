          python demo.py > /tmp/motif011demo.json
          echo '__MOTIF011_DEMO_START__'
          cat /tmp/motif011demo.json
          echo '__MOTIF011_DEMO_END__'
      - name: Test 011
        working-directory: experiments/011
        run: python -m unittest -v test_skeptic.py
      - name: Reproduce 010
        working-directory: experiments/010
        run: |
          python benchmark.py > /tmp/motif010.json
          echo '__MOTIF010_RESULT_START__'
          cat /tmp/motif010.json
