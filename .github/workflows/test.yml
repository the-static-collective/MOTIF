name: MOTIF experiments
on:
  push:
  pull_request:
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 001
        working-directory: experiments/001
        run: python -m unittest -v test_motif.py
      - name: Test 002
        working-directory: experiments/002
        run: python -m unittest -v test_motif002.py
      - name: Test 003
        working-directory: experiments/003
        run: python -m unittest -v test_affordance.py
      - name: Test 004
        working-directory: experiments/004
        run: python -m unittest -v test_scar.py
      - name: Test 005
        working-directory: experiments/005
        run: python -m unittest -v test_concept.py
      - name: Test 006
        working-directory: experiments/006
        run: python -m unittest -v test_question.py
      - name: Checkout pinned Dogram calculation kernel
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: 551b5f9df18f17ec69b452ddcdff01718e0ff771
          path: vendor/Dogram
      - name: Verify native Dogram probe-cost receipts
        working-directory: experiments/006
        run: |
          python dogram_bridge.py --dogram-root ../../vendor/Dogram > /tmp/motif-dogram.json
          python - <<'PY'
          import json
          with open('/tmp/motif-dogram.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['schema'] == 'motif.dogram-calculate-only/v0'
          assert len(result['pair_receipts']) == 4
          assert result['collapse_analysis']['target_relative_sufficiency'] is True
          assert len(result['collapse_analysis']['dogram_calculation']['lost_distinctions']) == 2
          assert result['source']['excluded_trials'] == ['e_refused-part']
          assert all('a_part-surrogate' in entry['dogram_calculation']['separating_probes']
                     for entry in result['pair_receipts'])
          PY
      - name: Reproduce 006
        working-directory: experiments/006
        run: python question.py
      - name: Reproduce 005
        working-directory: experiments/005
        run: python concept.py
      - name: Reproduce 004
        working-directory: experiments/004
        run: python scar.py
      - name: Reproduce 003
        working-directory: experiments/003
        run: python affordance.py
      - name: Reproduce 001
        working-directory: experiments/001
        run: python motif.py
      - name: Reproduce 002
        working-directory: experiments/002
        run: python motif002.py
