name: MOTIF experiments
on:
  push:
  pull_request:
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 001
        working-directory: experiments/001
        run: python -m unittest -v test_motif.py
      - name: Test 002
        working-directory: experiments/002
        run: python -m unittest -v test_motif002.py
      - name: Test 003
        working-directory: experiments/003
        run: python -m unittest -v test_affordance.py
      - name: Test 004
        working-directory: experiments/004
        run: python -m unittest -v test_scar.py
      - name: Test 005
        working-directory: experiments/005
        run: python -m unittest -v test_concept.py
      - name: Test 006
        working-directory: experiments/006
        run: python -m unittest -v test_composition.py
      - name: Test 007
        working-directory: experiments/007
        run: python -m unittest -v test_inheritance.py
      - name: Test 008
        working-directory: experiments/008
        run: python -m unittest -v test_unknown.py
      - name: Test 009
        working-directory: experiments/009
        run: python -m unittest -v test_experimenter.py
      - name: Reproduce 013
        working-directory: experiments/013
        run: |
          python benchmark.py > /tmp/motif013.json
          echo '__MOTIF013_RESULT_START__'
          cat /tmp/motif013.json
          echo '__MOTIF013_RESULT_END__'
      - name: Reproduce 013 witness cases and uncertain tree cartridges
        working-directory: experiments/013
        run: |
          python demo.py > /tmp/motif013demo.json
          echo '__MOTIF013_DEMO_START__'
          cat /tmp/motif013demo.json
          echo '__MOTIF013_DEMO_END__'
      - name: Test 013
        working-directory: experiments/013
        run: python -m unittest -v test_witness.py
      - name: Reproduce 012
        working-directory: experiments/012
        run: |
          python benchmark.py > /tmp/motif012.json
          echo '__MOTIF012_RESULT_START__'
          cat /tmp/motif012.json
          echo '__MOTIF012_RESULT_END__'
      - name: Reproduce 012 causal map cartridge
        working-directory: experiments/012
