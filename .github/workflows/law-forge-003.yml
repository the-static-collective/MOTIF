name: MOTIF Law Forge 003 — NAND Operator Foundry

on:
  push:
    branches:
      - research/law-forge-003-operator-foundry-20261105
    paths:
      - 'experiments/law-forge-001/**'
      - 'experiments/law-forge-002/**'
      - 'experiments/law-forge-003/**'
      - '.github/workflows/law-forge-003.yml'
  pull_request:
    paths:
      - 'experiments/law-forge-001/**'
      - 'experiments/law-forge-002/**'
      - 'experiments/law-forge-003/**'
      - '.github/workflows/law-forge-003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nand-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify inherited LAW-FORGE-001
        run: python -m unittest discover -s experiments/law-forge-001 -p 'test_*.py' -v
      - name: Verify inherited LAW-FORGE-002
        run: python -m unittest discover -s experiments/law-forge-002 -p 'test_*.py' -v
      - name: Verify new operator synthesizer
        run: python -m unittest discover -s experiments/law-forge-003 -p 'test_*.py' -v
      - name: Generate experiment transcript and complete benchmark receipt
        run: |
          python experiments/law-forge-003/trial.py > law-forge-003-results.json
          python -m json.tool law-forge-003-results.json > /dev/null
      - name: Print matched-method comparison
        run: |
          python -c "import json; r=json.load(open('law-forge-003-results.json')); print(json.dumps({'development': r['development'], 'evaluation': r['evaluation'], 'decision': r['frozen_method_decision'], 'example_NAND_gates': r['xor_operator']['source_operator_packet']['netlist']['gates']}, indent=2))"
      - name: Preserve receipts for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: law-forge-003-receipt
          path: law-forge-003-results.json
          retention-days: 30
