name: SELF-ASSEMBLY-001 actual cartridge composition

on:
  push:
    branches:
      - 'experiment/self-assembly-001-20261108'
  pull_request:
    paths:
      - 'experiments/assemblylab001/**'
      - 'experiments/003/**'
      - 'experiments/nextstep001/**'
      - 'experiments/selfmirror001/**'
      - 'experiments/mathal001/**'
      - 'experiments/witnesschain001/**'
      - '.github/workflows/assemblylab001-tests.yml'

permissions:
  contents: read

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression prerequisites
        shell: bash
        run: |
          set -eu
          (cd experiments/fir001 && python -m unittest -q test_fir.py)
          (cd experiments/mathal001 && python -m unittest -q test_mathal.py)
          (cd experiments/selfmirror001 && python -m unittest -q test_selfmirror.py)
          (cd experiments/witnesschain001 && python -m unittest -q test_witnesschain.py)
          (cd experiments/nextstep001 && python -m unittest -q test_nextstep.py)
          (cd experiments/selfbuild001 && python -m unittest -q test_selfbuild.py)
      - name: Actual source integration and hostile controls
        working-directory: experiments/assemblylab001
        run: |
          python -m unittest -v test_assembly.py
          python assembly.py
          python benchmark.py
