name: MOTIF GEOM-011 Missing Dimension
on:
  push:
    paths:
      - 'experiments/geometry-011/**'
      - '.github/workflows/motif-geometry-011.yml'
  pull_request:
    paths:
      - 'experiments/geometry-011/**'
      - '.github/workflows/motif-geometry-011.yml'
jobs:
  missing-dimension-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial and randomized classical controls
        run: |
          cd experiments/geometry-011
          python -m unittest -v test_missing_dimension.py
      - name: Demo, heldout comparator, local JSON entrypoint
        run: |
          cd experiments/geometry-011
          python demo.py > /tmp/geom011-demo.json
          python benchmark.py > /tmp/geom011-benchmark.json
          python interface.py example-input.json > /tmp/geom011-interface.json
          python -m json.tool /tmp/geom011-demo.json > /dev/null
          python -m json.tool /tmp/geom011-benchmark.json > /dev/null
          python -m json.tool /tmp/geom011-interface.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: geom011-synthetic-evidence
          path: |
            /tmp/geom011-demo.json
            /tmp/geom011-benchmark.json
            /tmp/geom011-interface.json
