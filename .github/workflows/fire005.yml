name: FIRE-005 Discernment and Rollback
on:
  push:
    paths:
      - 'experiments/fire005/**'
      - 'experiments/fire004/**'
      - 'experiments/fire003/**'
      - 'experiments/fire002/**'
      - 'experiments/fire001/**'
      - '.github/workflows/fire005.yml'
  pull_request:
    paths:
      - 'experiments/fire005/**'
      - 'experiments/fire004/**'
      - 'experiments/fire003/**'
      - 'experiments/fire002/**'
      - 'experiments/fire001/**'
      - '.github/workflows/fire005.yml'
jobs:
  prequential-discernment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run FIRE-001 through FIRE-005 safety and consistency tests
        run: |
          python -m unittest discover -s experiments/fire001 -p 'test_*.py' -v
          python -m unittest discover -s experiments/fire002 -p 'test_*.py' -v
          python -m unittest discover -s experiments/fire003 -p 'test_*.py' -v
          python -m unittest discover -s experiments/fire004 -p 'test_*.py' -v
          python -m unittest discover -s experiments/fire005 -p 'test_*.py' -v
      - name: Run frozen new-seed 960-world BOCPD trial
        run: |
          python experiments/fire005/benchmark.py > /tmp/fire005.json
          echo '__FIRE005_RESULT_START__'
          cat /tmp/fire005.json
          echo '__FIRE005_RESULT_END__'
      - name: Preserve benchmark
        uses: actions/upload-artifact@v4
        with:
          name: fire005-discernment-evidence
          path: /tmp/fire005.json
