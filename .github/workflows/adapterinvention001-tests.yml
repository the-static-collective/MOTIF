name: ADAPTER-INVENTION-001 typed synthesis and hostile controls

on:
  push:
    branches:
      - 'experiment/adapter-invention-001-20261108'
  pull_request:
    paths:
      - 'experiments/adapterinvention001/**'
      - 'experiments/003/**'
      - 'experiments/selfmirror001/**'
      - 'experiments/contextgate001/**'
      - 'experiments/assemblylab001/**'
      - '.github/workflows/adapterinvention001-tests.yml'

permissions:
  contents: read

jobs:
  adapter-invention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual source-cartridge regression checks
        shell: bash
        run: |
          set -eu
          (cd experiments/fir001 && python -m unittest -q test_fir.py)
          (cd experiments/mathal001 && python -m unittest -q test_mathal.py)
          (cd experiments/selfmirror001 && python -m unittest -q test_selfmirror.py)
          (cd experiments/assemblylab001 && python -m unittest -q test_assembly.py)
      - name: Synthesize, execute, and attack a new bridge
        working-directory: experiments/adapterinvention001
        run: |
          python -m unittest -v test_adapterinvention.py
          python adapterinvention.py
          python benchmark.py
