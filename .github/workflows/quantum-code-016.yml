name: MOTIF QC-016 nested-cycle frontier and goal information dividend
on:
  push:
    paths:
      - 'experiments/quantumcode016/**'
      - '.github/workflows/quantum-code-016.yml'
  pull_request:
    paths:
      - 'experiments/quantumcode016/**'
      - '.github/workflows/quantum-code-016.yml'
permissions:
  contents: read
jobs:
  nested-oscillation-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bounded nested loops and goal-relative probes
        working-directory: experiments/quantumcode016
        run: python -m unittest -v test_meta_cycles.py test_goal_probe.py
      - name: Install independently authored Crafter 1.8.3
        run: python -m pip install 'crafter==1.8.3' pillow
      - name: Reproduce ordinal, source-pinned probe selection
        working-directory: experiments/quantumcode016
        run: python goal_probe.py
      - name: Execute 8 real-game cycles-of-cycles and goal probe episodes
        env:
          QC016_OUTPUT_DIR: runs/crafter-qc016
        run: python experiments/quantumcode016/game_goal_replay.py
      - name: Validate game episodes and full source-pinned replay history
        run: |
          python - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,"experiments/quantumcode011")
          from ingest import read_bundle
          root=pathlib.Path("runs/crafter-qc016")
          d=json.loads((root/"comparison.json").read_text())
          assert len(d["pairs"])==4,d
          files=sorted(root.glob("*/annotated_gameplay.json"))
          assert len(files)==8,len(files)
          total=0
          for f in files:
              r=read_bundle(f)
              assert all(e.source=="GAME_TELEMETRY" for e in r.episodes)
              total+=len(r.episodes)
          assert total==d["total_game_actions"],(total,d["total_game_actions"])
          print("QC016_VERIFIED_ENGINE_ACTIONS="+str(total))
          PY
      - name: Archive actual virtual-world outcomes and every replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc016-nested-cycles-goal-replay-evidence
          path: runs/crafter-qc016/
          if-no-files-found: warn
          retention-days: 30
