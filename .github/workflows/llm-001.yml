name: LLM-001 source-bound convergence
on:
  push:
    branches:
      - experiment/llm001-proof-carrying-branch-compiler-20261112
  pull_request:
    paths:
      - 'experiments/llm001/**'
      - '.github/workflows/llm-001.yml'
  workflow_dispatch:
jobs:
  offline-source-bound-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test experiments/llm001/test.mjs
