name: SEMANTIC-ADAPTER-001 behavioral contract checks

on:
  push:
    branches:
      - 'experiment/semantic-adapter-001-20261109'
  pull_request:
    paths:
      - 'experiments/semanticadapter001/**'
      - 'experiments/adapterinvention001/**'
      - 'experiments/assemblylab001/**'
      - 'experiments/003/**'
      - '.github/workflows/semanticadapter001-tests.yml'

permissions:
  contents: read

jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test foundational FIR and mathal layers
        run: |
          set -eu
          (cd experiments/fir001 && python -m unittest -q test_fir.py)
          (cd experiments/mathal001 && python -m unittest -q test_mathal.py)
          (cd experiments/selfmirror001 && python -m unittest -q test_selfmirror.py)
      - name: Adapter and assembly regressions
        run: |
          set -eu
          (cd experiments/assemblylab001 && python -m unittest -q test_assembly.py)
          (cd experiments/adapterinvention001 && python -m unittest -q test_adapterinvention.py)
      - name: Inferred semantic contracts and hostile swaps
        working-directory: experiments/semanticadapter001
        run: |
          python -m unittest -v test_semanticadapter.py
          python semanticadapter.py
          python benchmark.py
