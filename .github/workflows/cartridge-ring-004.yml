name: MOTIF Ring 004 / same-world native method falsifier

on:
  push:
    branches:
      - experiment/cartridge-ring-004-shared-evidence-trial
  pull_request:
    paths:
      - 'experiments/cartridge-ring-004/**'
      - '.github/workflows/cartridge-ring-004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-world:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-owned shared evidence contracts and anti-leakage tests
        run: |
          python -m unittest discover -s experiments/cartridge-ring-004 -p 'test_*.py' -v
      - name: Frozen hidden-label source packet and cross-native evaluation
        run: |
          docker pull python:3.11-slim
          python experiments/cartridge-ring-004/comparator.py --count 32 --seed 2026110615 --out /tmp/motif-shared32.json
          python experiments/cartridge-ring-004/comparator.py --count 32 --seed 2026110616 --out /tmp/motif-shared32-different.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/motif-shared32.json'))
          b=json.load(open('/tmp/motif-shared32-different.json'))
          assert a['schema']=='motif.shared-evidence-benchmark.v1'
          assert a['source_packet_sha256'] != b['source_packet_sha256']
          assert a['count']==32 and b['count']==32
          for r in (a,b):
              assert r['actual_independent_native_task_outputs_compared']
              assert r['all_methods_process_identical_synthetic_case_ids']
              assert r['training_labels_not_passed_to_native_container']
              assert r['method_results']['strong_classical_dedup_and_bfs']['correct']==32
              assert not r['external_action_executed']
              assert not r['real_world_authority']
          print('Two unseen-to-native authored synthetic worlds evaluated against strong classical control.')
          PY
      - name: Feed measured synthetic outcomes back into hypergraph evidence layer
        run: |
          python experiments/cartridge-ring-004/feedback.py \
            --trials /tmp/motif-shared32.json /tmp/motif-shared32-different.json \
            --out /tmp/motif-shared-feedback.json
          python - <<'PY'
          import json
          f=json.load(open('/tmp/motif-shared-feedback.json'))
          assert f['tested_case_count']==64
          assert f['independent_seed_packets']==2
          assert f['verified_real_world_affordance_edges_added']==0
          assert f['installed_executable_adapters_added']==0
          assert f['strong_classical_baseline_matches_or_exceeds_full_native']
          assert f['simple_language_plus_geometry_classical_substitute_matches_or_exceeds']
          assert f['authority']=='NONE'
          assert f['paired_differences_vs_full_native']['all_three_without_tiny_model']['paired_correct_count_difference']>0
          print('Measured synthetic evidence joins hypergraph; native combo does not surpass strong classical control.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: motif-ring004-shared-world-ablations
          path: |
            /tmp/motif-shared32.json
            /tmp/motif-shared32-different.json
            /tmp/motif-shared-feedback.json
          retention-days: 30
