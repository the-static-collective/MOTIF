name: MOTIF GEOM-012 Instrument Synthesis
on:
  push:
    paths:
      - 'experiments/geometry-012/**'
      - '.github/workflows/motif-geometry-012.yml'
  pull_request:
    paths:
      - 'experiments/geometry-012/**'
      - '.github/workflows/motif-geometry-012.yml'
jobs:
  synthetic-instrument-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and adversarial tests, including GEOM-008 archive integration
        run: |
          cd experiments/geometry-012
          python -m unittest -v test_instrument_lab.py
      - name: Reproducible local measurement synthesis and classical baseline
        run: |
          cd experiments/geometry-012
          python demo.py >/tmp/geom012-demo.json
          python benchmark.py >/tmp/geom012-benchmark.json
          python interface.py example-input.json >/tmp/geom012-interface.json
          python -m json.tool /tmp/geom012-demo.json >/dev/null
          python -m json.tool /tmp/geom012-benchmark.json >/dev/null
          python -m json.tool /tmp/geom012-interface.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: geom012-synthetic-instrument-evidence
          path: |
            /tmp/geom012-demo.json
            /tmp/geom012-benchmark.json
            /tmp/geom012-interface.json
