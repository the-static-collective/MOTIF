name: MOTIF three-bet reframe pilot

on:
  push:
    paths:
      - 'experiments/002/**'
      - 'experiments/006/**'
      - 'experiments/field004/**'
      - 'experiments/reframe_trial/**'
      - '.github/workflows/motif-reframe-trial.yml'
  pull_request:
    paths:
      - 'experiments/002/**'
      - 'experiments/006/**'
      - 'experiments/field004/**'
      - 'experiments/reframe_trial/**'
      - '.github/workflows/motif-reframe-trial.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/006 -v
      - run: python -m unittest discover -s experiments/field004 -v
      - run: python -m unittest discover -s experiments/reframe_trial -v
      - run: python experiments/reframe_trial/trial.py > motif-reframe-pilot.json
      - uses: actions/upload-artifact@v4
        with:
          name: motif-reframe-pilot
          path: motif-reframe-pilot.json
