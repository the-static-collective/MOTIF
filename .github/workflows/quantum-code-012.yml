name: MOTIF QC-012 actual Crafter game playthrough
on:
  push:
    paths:
      - 'experiments/quantumcode012/**'
      - '.github/workflows/quantum-code-012.yml'
  pull_request:
    paths:
      - 'experiments/quantumcode012/**'
      - '.github/workflows/quantum-code-012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-survival-game-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent third-party Crafter game engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'crafter==1.8.3' pillow
      - name: Execute three actual seeded game episodes and annotate
        env:
          QC012_OUTPUT_DIR: runs/crafter-qc012
        run: python experiments/quantumcode012/play_crafter.py
      - name: Verify actual saved telemetry with unchanged QC-011 parser
        run: |
          python - <<'PY'
          import pathlib,sys
          sys.path.insert(0,"experiments/quantumcode011")
          from ingest import read_bundle
          root=pathlib.Path("runs/crafter-qc012")
          files=sorted(root.glob("*/annotated_gameplay.json"))
          assert len(files)==3,(len(files),list(root.glob("*")))
          count=0
          for path in files:
              replay=read_bundle(path)
              assert len(replay.episodes)>5
              assert all(e.source=="GAME_TELEMETRY" for e in replay.episodes)
              assert all(e.game=="OTHER_GAME" for e in replay.episodes)
              count+=len(replay.episodes)
          print("QC012_VERIFIED_ACTUAL_EPISODE_TRACE_COUNT="+str(count))
          PY
      - name: Publish actual game telemetry and screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc012-real-crafter-gameplay-evidence
          path: runs/crafter-qc012/
          if-no-files-found: warn
          retention-days: 30
