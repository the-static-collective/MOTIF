name: FIELD-018 honest image-to-matter integration gates
on:
  pull_request:
    paths:
      - 'experiments/field018/**'
      - '.github/workflows/field-018.yml'
  push:
    paths:
      - 'experiments/field018/**'
      - '.github/workflows/field-018.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local CV deps
        run: python -m pip install -r experiments/field018/requirements.txt
      - name: Execute chain regression
        run: python -m unittest discover -v -s experiments/field018
      - name: Execute synthetic public fixture and verify hard HOLD
        run: |
          python experiments/field018/demo.py --out /tmp/field018.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/field018.json'))
          statuses={x['name']:x['status'] for x in d['stage_gate']}
          assert statuses['Automatic image-semantic inventory']=='BLOCKED'
          assert statuses['Source-grounded yard physical calculation']=='BLOCKED'
          assert statuses['Synthetic 3D mechanics + recursive revision']=='PASS_SYNTHETIC_ONLY'
          assert d['real']['claims']['model_inference_calls']==0
          assert not d['real']['claims']['animal_containment_certified']
          PY
