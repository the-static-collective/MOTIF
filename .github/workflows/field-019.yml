name: FIELD-019 cross-domain geometry checks
on:
  push:
    paths: ['experiments/field019/**','.github/workflows/field-019.yml']
  pull_request:
    paths: ['experiments/field019/**','.github/workflows/field-019.yml']
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install projective-geometry dependencies
        working-directory: experiments/field019
        run: python -m pip install -r requirements.txt
      - name: Run cross-domain source/camera/scale tests
        working-directory: experiments/field019
        run: python -m unittest discover -v
      - name: Run constrained synthetic and real-source HOLD checks
        working-directory: experiments/field019
        run: |
          python run.py --sample synthetic
          python run.py --sample private-hold
