name: MOTIF Law Forge 010 — Blind Falsifier

on:
  push:
    branches:
      - research/law-forge-010-blind-falsifier-20261105
    paths:
      - 'experiments/law-forge-010/**'
      - '.github/workflows/law-forge-010.yml'
  pull_request:
    paths:
      - 'experiments/law-forge-010/**'
      - '.github/workflows/law-forge-010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-identification-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify inherited Law Forge 001 through 009 suites
        run: |
          for generation in 001 002 003 004 005 006 007 008 009; do
            python -m unittest discover -s "experiments/law-forge-${generation}" -p 'test_*.py' -v
          done
      - name: Test grammar-gap, owner-query and audit-ledger falsifiers
        run: python -m unittest discover -s experiments/law-forge-010 -p 'test_*.py' -v
      - name: Freeze development/final comparisons and source-owned challenge trace
        run: |
          mkdir -p law-forge-010-receipts
          python experiments/law-forge-010/trial.py > law-forge-010-receipts/benchmark.json
          python -m json.tool law-forge-010-receipts/benchmark.json > /dev/null
          python - <<'PY'
          import json
          r=json.load(open("law-forge-010-receipts/benchmark.json"))
          print(json.dumps({
            "development":r["development"],
            "evaluation":r["evaluation"],
            "frozen_method_decision":r["frozen_method_decision"]
          },indent=2))
          PY
      - name: Emit portable falsification cartridge and source-only proposed question
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0, "experiments/law-forge-010")
          from stranger_owner import Stranger
          from trial import identification
          from falsifier import AuditLedger
          from desk import SCHEMA, dispatch
          src=Stranger("two_bit_xor",3)
          learning,_=identification(src)
          ledger=AuditLedger(learning)
          receipt=ledger.packet()
          open("law-forge-010-receipts/audit-cartridge.json","w").write(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          res=dispatch({
              "schema":SCHEMA,"action":"propose",
              "audit_cartridge":receipt,
              "catalog":[q.packet() for q in src.catalog()]
          })
          assert res["status"] in (
              "PROPOSE_ONLY_SOURCE_QUESTION","HOLD_NO_SUPPORTED_CHALLENGE")
          assert res["real_world_authority"] is False
          open("law-forge-010-receipts/audit-question.json","w").write(
              json.dumps(res,indent=2,sort_keys=True)+"\n")
          PY
      - name: Preserve full inspectable research evidence (not source credentials)
        uses: actions/upload-artifact@v4
        with:
          name: law-forge-010-blind-falsifier-receipts
          path: law-forge-010-receipts/
          retention-days: 30
