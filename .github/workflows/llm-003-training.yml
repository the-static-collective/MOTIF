name: LLM-003B Real Graph Adapter Negatives Trial
on:
  push:
    branches:
      - experiment/llm003-error-dividend-openweights-20261112
    paths:
      - 'experiments/llm003/RUN_TRAINED_ADAPTER.md'
  workflow_dispatch:
jobs:
  real-pretrained-graph-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_ETAG_TIMEOUT: '20'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU pretrained-model dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check --no-input 'transformers==4.49.0' 'huggingface-hub>=0.28,<1.0' 'safetensors>=0.4,<1.0'
      - name: Train rank-two adapter on verified, positives-only, corrupted negatives
        run: python experiments/llm003/train_pretrained_adapter.py
